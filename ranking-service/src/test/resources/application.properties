spring.datasource.url=jdbc:h2:mem:ranking-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
ranking.events.enabled=false
ranking.scheduling-enabled=false
logging.level.root=WARN

# wallet-service, shop-service and social-service are not running locally (SPEC §9.4).
ranking.wallet.mock=true
ranking.shop.mock=true
ranking.social.mock=true

eureka.client.enabled=false
