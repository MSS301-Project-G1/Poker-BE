spring.application.name=ranking-service
server.port=${SERVER_PORT:8086}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${RANKING_DB_URL:jdbc:postgresql://localhost:5432/ranking_db}
spring.datasource.username=${RANKING_DB_USER:poker}
spring.datasource.password=${RANKING_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
ranking.events.enabled=${RANKING_EVENTS_ENABLED:true}
ranking.rewards.enabled=${RANKING_REWARDS_ENABLED:true}
ranking.rewards.poll-millis=5000
ranking.starting-elo=0
ranking.min-elo=0
ranking.elo-by-place=20,10,5,-5,-10,-15
ranking.win-streak-places=3
ranking.reward-multipliers=3,2,1
ranking.tier-thresholds=0,100,200,350,500,700,950,1250,1600
ranking.card-god-limit=50
ranking.tutorial-reward-coins=200
ranking.wallet-url=${WALLET_SERVICE_URL:http://wallet-service}
ranking.shop-url=${SHOP_SERVICE_URL:http://shop-service}
ranking.social-url=${SOCIAL_SERVICE_URL:http://social-service}
ranking.social-internal-key=${SOCIAL_INTERNAL_KEY:}
# SPEC §9.4 mocks for services not running locally; true in application-dev.properties.
ranking.wallet.mock=false
ranking.shop.mock=false
ranking.social.mock=false
ranking.seasons.check-millis=60000
ranking.seasons.notification-batch=500

# Register the address reachable from the gateway.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.value}
