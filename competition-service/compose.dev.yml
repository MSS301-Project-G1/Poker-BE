services:
  competition-service:
    ports: !override
      - "127.0.0.1:8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ADDRESS: 0.0.0.0
      RABBITMQ_PORT: 5672
      # The container shares the stack with discovery-service, so service names resolve through Eureka.
      EUREKA_CLIENT_ENABLED: "true"
      COMPETITION_DEV_DB_PASSWORD: ${COMPETITION_DB_PASSWORD:-poker_dev}
