spring.datasource.url=jdbc:h2:mem:competition-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
competition.events.enabled=false
competition.scheduling-enabled=false
logging.level.root=WARN

# wallet-service, shop-service and social-service are not running locally (SPEC §9.4).
competition.wallet.mock=true
competition.shop.mock=true
competition.social.mock=true
eureka.client.enabled=false
