spring.datasource.url=${COMPETITION_DB_URL:jdbc:postgresql://127.0.0.1:15432/competition_db}
spring.datasource.username=${COMPETITION_DB_USER:poker}
spring.datasource.password=${COMPETITION_DEV_DB_PASSWORD:poker_dev}
spring.rabbitmq.port=${RABBITMQ_PORT:5679}
server.address=127.0.0.1

# wallet-service, shop-service and social-service are not running locally (SPEC §9.4).
competition.wallet.mock=true
competition.shop.mock=true
competition.social.mock=true

# Dev runs the jar on the host without Eureka, like game-service. Service names resolve to these
# local ports instead. With EUREKA_CLIENT_ENABLED=true, Eureka (order 0) is asked before these (order 1).
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
spring.cloud.discovery.client.simple.order=1
spring.cloud.discovery.client.simple.instances.game-service[0].uri=http://localhost:8082
spring.cloud.discovery.client.simple.instances.ranking-service[0].uri=http://localhost:8086
spring.cloud.discovery.client.simple.instances.shop-service[0].uri=http://localhost:8088
spring.cloud.discovery.client.simple.instances.social-service[0].uri=http://localhost:8084
spring.cloud.discovery.client.simple.instances.wallet-service[0].uri=http://localhost:8089
