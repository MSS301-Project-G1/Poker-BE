spring.application.name=competition-service
server.port=${SERVER_PORT:8087}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${COMPETITION_DB_URL:jdbc:postgresql://localhost:5432/competition_db}
spring.datasource.username=${COMPETITION_DB_USER:poker}
spring.datasource.password=${COMPETITION_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
competition.events.enabled=${COMPETITION_EVENTS_ENABLED:true}
competition.room.min-players=2
competition.room.max-players=6
competition.room.starting-chips=1000
competition.room.turn-time-seconds=20
competition.room.code-length=6
competition.tournament.slots=32
competition.tournament.table-size=8
competition.tournament.advance-per-table=2
competition.tournament.min-players=4
competition.tournament.invite-lead-minutes=30
competition.tournament.confirm-deadline-minutes=10
competition.tournament.prize-shares=50,30,20
competition.tournament.launch-millis=2000
competition.tournament.schedule-millis=30000
competition.wallet.poll-millis=5000
competition.shop.poll-millis=5000
competition.game-url=${GAME_SERVICE_URL:http://game-service}
competition.game-service-key=${GAME_SERVICE_KEY:}
competition.social-url=${SOCIAL_SERVICE_URL:http://social-service}
competition.social-internal-key=${SOCIAL_INTERNAL_KEY:}
competition.wallet-url=${WALLET_SERVICE_URL:http://wallet-service}
competition.ranking-url=${RANKING_SERVICE_URL:http://ranking-service}
competition.shop-url=${SHOP_SERVICE_URL:http://shop-service}
# SPEC §9.4 mocks for services not running locally; true in application-dev.properties.
competition.wallet.mock=false
competition.shop.mock=false
competition.social.mock=false

# Register the address reachable from the gateway.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.value}
