services:
  shop-service:
    build:
      context: ..
      args:
        MODULE: shop-service
    ports:
      - "${SHOP_SERVICE_PORT:-8088}:8088"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=poker123456
      - S3_BUCKET=poker-assets
      - S3_PUBLIC_URL=http://localhost:9000/poker-assets
      - WALLET_SERVICE_URL=http://wallet-service:8089
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: poker-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: poker-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: poker123456
    volumes:
      - minio-data:/data
    user: "0:0"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  minio-data:
