name: shop-service

services:
  shop-service:
    build:
      context: ..
      dockerfile: shop-service/Dockerfile
    container_name: shop-service
    ports:
      - "${SHOP_SERVICE_PORT:-8088}:8088"
    environment:
      - DB_HOST=shop-postgres
      - DB_PORT=5432
      - DB_NAME=shop_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - REDIS_HOST=shop-redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - WALLET_SERVICE_URL=${WALLET_SERVICE_URL:-http://wallet-service:8089}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID:-}
      - PAYOS_API_KEY=${PAYOS_API_KEY:-}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://shop-minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-poker123456}
      - S3_BUCKET=${S3_BUCKET:-poker-assets}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000/poker-assets}
    depends_on:
      shop-postgres:
        condition: service_healthy
      shop-redis:
        condition: service_healthy
      shop-minio:
        condition: service_healthy

  shop-postgres:
    image: postgres:16
    container_name: shop-postgres
    restart: unless-stopped
    ports:
      - "${SHOP_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - shop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  shop-redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - shop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  shop-minio:
    image: alpine/minio:latest-release
    container_name: shop-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-poker123456}
    volumes:
      - shop-minio-data:/data
    user: "0:0"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shop-postgres-data:
  shop-redis-data:
  shop-minio-data:

networks:
  default:
    name: poker-network
