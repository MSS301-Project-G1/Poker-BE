spring.application.name=shop-service
server.port=${SERVER_PORT:8088}

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:shop_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=${CACHE_TYPE:redis}
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.health.redis.enabled=false
management.health.rabbit.enabled=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# PayOS Configuration (Phase B)
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/shop/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/shop/payment/cancel}
shop.order.expire-minutes=${SHOP_ORDER_EXPIRE_MINUTES:15}
shop.order.reconcile-delay-ms=${SHOP_ORDER_RECONCILE_DELAY_MS:60000}
shop.order.reconcile-initial-delay-ms=${SHOP_ORDER_RECONCILE_INITIAL_DELAY_MS:30000}
vietqr.template-url=${VIETQR_TEMPLATE_URL:https://img.vietqr.io/image}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:false}

# Wallet Service URL (Strictly driven by environment variable WALLET_SERVICE_URL)
wallet.service.url=${WALLET_SERVICE_URL}

# Feature Flags
features.sandbox-payment.enabled=${FEATURES_SANDBOX_PAYMENT_ENABLED:true}



