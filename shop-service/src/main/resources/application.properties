spring.application.name=shop-service
spring.config.import=optional:file:.env[.properties],optional:file:shop-service/.env[.properties]
server.port=${SERVER_PORT:8088}

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=${CACHE_TYPE:redis}
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.health.redis.enabled=false
management.health.rabbit.enabled=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/shop/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/shop/payment/cancel}
shop.payos.client-id=${PAYOS_CLIENT_ID:}
shop.payos.api-key=${PAYOS_API_KEY:}
shop.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
shop.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/shop/payment/success}
shop.order.expire-minutes=${SHOP_ORDER_EXPIRE_MINUTES:5}
shop.order-expire-minutes=${SHOP_ORDER_EXPIRE_MINUTES:5}
shop.order.reconcile-delay-ms=${SHOP_ORDER_RECONCILE_DELAY_MS:60000}
shop.order.reconcile-initial-delay-ms=${SHOP_ORDER_RECONCILE_INITIAL_DELAY_MS:30000}
vietqr.template-url=${VIETQR_TEMPLATE_URL:https://img.vietqr.io/image}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:false}

# Wallet Service URL
wallet.service.url=${WALLET_SERVICE_URL:http://localhost:8089}
shop.wallet-service-url=${WALLET_SERVICE_URL:http://localhost:8089}

# Feature Flags
features.sandbox-payment.enabled=${FEATURES_SANDBOX_PAYMENT_ENABLED:true}
shop.features.sandbox-payment-enabled=${FEATURES_SANDBOX_PAYMENT_ENABLED:true}

# Multipart Upload Settings (support 53 card skins ZIP up to 35MB)
spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=35MB

# S3 / MinIO Object Storage
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.access-key=${S3_ACCESS_KEY:}
s3.secret-key=${S3_SECRET_KEY:}
s3.bucket=${S3_BUCKET:poker-assets}
s3.public-url=${S3_PUBLIC_URL:http://localhost:9000/poker-assets}
s3.region=${S3_REGION:ap-southeast-1}

# Eureka Client Configuration
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.value}

# AI Model Provider Configuration
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.project-name=${GEMINI_PROJECT_NAME:PockerGemini}
ai.openai.api-key=${OPENAI_API_KEY:}
asset-sandbox.url=${ASSET_SANDBOX_URL:http://localhost:8095}


