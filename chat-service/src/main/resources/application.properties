spring.application.name=chat-service
server.port=${SERVER_PORT:8085}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://localhost:54337/chat_db}
spring.datasource.username=${CHAT_DB_USER:poker}
spring.datasource.password=${CHAT_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USER:poker}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
chat.gateway-key=${CHAT_GATEWAY_KEY:}
chat.internal-key=${CHAT_INTERNAL_KEY:}
chat.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}
chat.jwt.issuer=${JWT_ISSUER:http://localhost:8090}
chat.jwt.audience=${JWT_AUDIENCE:poker}
chat.ws.allowed-origins=${CHAT_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:18080,http://localhost:8080}
chat.ws.message-size=${CHAT_WS_MESSAGE_SIZE:8192}
chat.ws.messages-per-second=${CHAT_WS_RATE:10}
springdoc.paths-to-match=/api/**

chat.social-url=${SOCIAL_SERVICE_URL:http://localhost:8084}
chat.social-internal-key=${SOCIAL_INTERNAL_KEY:}
chat.social-timeout=${CHAT_SOCIAL_TIMEOUT:3s}
chat.max-content-length=${CHAT_MAX_CONTENT_LENGTH:2000}

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.value}
