spring.application.name=game-service
server.port=${SERVER_PORT:8082}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${GAME_DB_URL:jdbc:postgresql://localhost:5432/game_db}
spring.datasource.username=${GAME_DB_USER:poker}
spring.datasource.password=${GAME_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
game.events.enabled=${GAME_EVENTS_ENABLED:true}
game.small-blind=10
game.big-blind=20
game.starting-chips=1000
game.turn-time-seconds=20
game.min-players=2
game.max-players=6
game.tournament-max-players=8
game.hand-pause-millis=4000
game.afk-turns=3
game.table-retention-seconds=300
game.allowed-origins=${GAME_ALLOWED_ORIGINS:http://localhost:5173}
game.service-key=${GAME_SERVICE_KEY:}
