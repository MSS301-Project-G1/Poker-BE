# Profile "local": run from the IDE while the infra runs in Docker (root docker-compose.yml).
# Values are the host ports compose publishes; shared keys come from the root .env.
# Unlike the "dev" profile, this keeps Eureka on so the gateway can route to it.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${GAME_DB_URL:jdbc:postgresql://localhost:15429/game_db}
spring.datasource.password=${GAME_DB_PASSWORD:poker_dev}
spring.rabbitmq.port=${RABBITMQ_PORT:5679}
game.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}
# Same default as compose: auth-service has no restrictions endpoint yet.
game.restrictions.enabled=${GAME_RESTRICTIONS_ENABLED:false}
