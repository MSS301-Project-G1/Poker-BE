services:
  matchmaking-service:
    build:
      context: ..
      args:
        MODULE: matchmaking-service
    ports:
      - "${MATCHMAKING_SERVICE_PORT:-8083}:8083"
    environment:
      MATCHMAKING_DB_URL: jdbc:postgresql://matchmaking-db:5432/matchmaking_db
      MATCHMAKING_DB_USER: ${MATCHMAKING_DB_USER:-poker}
      MATCHMAKING_DB_PASSWORD: ${MATCHMAKING_DB_PASSWORD:-poker_dev}
      REDIS_HOST: matchmaking-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RANKING_SERVICE_URL: http://ranking-service:8086
      WALLET_SERVICE_URL: http://wallet-service:8089
      GAME_SERVICE_URL: http://game-service:8082
      GAME_SERVICE_KEY: ${GAME_SERVICE_KEY:-poker_game_dev}
      GAME_PUBLIC_HOST: ${GAME_PUBLIC_HOST:-localhost}
      GAME_PUBLIC_PORT: ${GAME_PUBLIC_PORT:-8082}
      GAME_WEBSOCKET_PATH: ${GAME_WEBSOCKET_PATH:-/ws/game}
      GAME_SESSION_TTL: ${GAME_SESSION_TTL:-24h}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MATCHMAKING_SWAGGER_ENABLED: ${MATCHMAKING_SWAGGER_ENABLED:-true}
      MATCHMAKING_NORMAL_FILL_TIMEOUT: ${MATCHMAKING_NORMAL_FILL_TIMEOUT:-10s}
      MATCHMAKING_WALLET_STUB_ENABLED: ${MATCHMAKING_WALLET_STUB_ENABLED:-true}
      MATCHMAKING_RESTRICTION_STUB_ENABLED: ${MATCHMAKING_RESTRICTION_STUB_ENABLED:-true}
    networks:
      - default
      - matchmaking-net
    depends_on:
      matchmaking-db:
        condition: service_healthy
      matchmaking-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  matchmaking-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchmaking_db
      POSTGRES_USER: ${MATCHMAKING_DB_USER:-poker}
      POSTGRES_PASSWORD: ${MATCHMAKING_DB_PASSWORD:-poker_dev}
    ports:
      - "127.0.0.1:${MATCHMAKING_DB_PORT:-54333}:5432"
    volumes:
      - matchmaking-db-data:/var/lib/postgresql/data
    networks:
      - matchmaking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  matchmaking-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${MATCHMAKING_REDIS_PORT:-6383}:6379"
    volumes:
      - matchmaking-redis-data:/data
    networks:
      - matchmaking-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

networks:
  matchmaking-net:

volumes:
  matchmaking-db-data:
  matchmaking-redis-data:
