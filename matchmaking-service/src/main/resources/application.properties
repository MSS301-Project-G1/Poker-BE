spring.application.name=matchmaking-service
server.port=${SERVER_PORT:8083}
management.endpoints.web.exposure.include=health,info

# OpenAPI/Swagger for local API contract testing.
springdoc.api-docs.enabled=${MATCHMAKING_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${MATCHMAKING_SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/matchmaking/**,/api/party/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# PostgreSQL owned by matchmaking-service
spring.datasource.url=${MATCHMAKING_DB_URL:jdbc:postgresql://localhost:5432/matchmaking_db}
spring.datasource.username=${MATCHMAKING_DB_USER:poker}
spring.datasource.password=${MATCHMAKING_DB_PASSWORD:poker_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis is private to matchmaking-service and stores transient queue state.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Shared RabbitMQ from docker/compose.infra.yml. Do not create a private broker.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Internal service URLs. Containers resolve these names on the default network.
matchmaking.ranking-url=${RANKING_SERVICE_URL:http://localhost:8086}
matchmaking.wallet-url=${WALLET_SERVICE_URL:http://localhost:8089}
matchmaking.game-url=${GAME_SERVICE_URL:http://localhost:8082}
matchmaking.game.public-host=${GAME_PUBLIC_HOST:localhost}
matchmaking.game.public-port=${GAME_PUBLIC_PORT:8082}
matchmaking.game.websocket-path=${GAME_WEBSOCKET_PATH:/ws/game}
matchmaking.game.session-ttl=${GAME_SESSION_TTL:24h}
matchmaking.game.service-key=${GAME_SERVICE_KEY:}
matchmaking.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8090}

# Normal/Rank player count comes from Game Match Settings managed by Admin.
matchmaking.normal.fill-timeout=${MATCHMAKING_NORMAL_FILL_TIMEOUT:10s}
matchmaking.rank.elo-window=${MATCHMAKING_RANK_ELO_WINDOW:100}
matchmaking.rank.entry-fee=${MATCHMAKING_RANK_ENTRY_FEE:100}
matchmaking.rank.fill-timeout=${MATCHMAKING_RANK_FILL_TIMEOUT:10s}
matchmaking.rank.accept-timeout=${MATCHMAKING_RANK_ACCEPT_TIMEOUT:10s}
matchmaking.rank.cooldown=${MATCHMAKING_RANK_COOLDOWN:2m}
matchmaking.ranking.timeout=${MATCHMAKING_RANKING_TIMEOUT:3s}
matchmaking.ranking.stub-enabled=${MATCHMAKING_RANKING_STUB_ENABLED:false}
matchmaking.restriction.timeout=${MATCHMAKING_RESTRICTION_TIMEOUT:3s}
matchmaking.restriction.stub-enabled=${MATCHMAKING_RESTRICTION_STUB_ENABLED:false}
matchmaking.wallet.timeout=${MATCHMAKING_WALLET_TIMEOUT:3s}
matchmaking.wallet.stub-enabled=${MATCHMAKING_WALLET_STUB_ENABLED:false}
matchmaking.queue.entry-ttl=${MATCHMAKING_QUEUE_ENTRY_TTL:24h}
matchmaking.queue.reservation-ttl=${MATCHMAKING_RESERVATION_TTL:2m}
matchmaking.finder.enabled=${MATCHMAKING_FINDER_ENABLED:true}
matchmaking.finder.fixed-delay-ms=${MATCHMAKING_FINDER_DELAY_MS:1000}
matchmaking.finder.lock-ttl=${MATCHMAKING_FINDER_LOCK_TTL:5s}
matchmaking.game.timeout=${MATCHMAKING_GAME_TIMEOUT:3s}
matchmaking.game.stub-enabled=${MATCHMAKING_GAME_STUB_ENABLED:false}
matchmaking.recovery.fixed-delay-ms=${MATCHMAKING_RECOVERY_DELAY_MS:5000}
matchmaking.recovery.retry-after=${MATCHMAKING_RECOVERY_RETRY_AFTER:10s}
matchmaking.party.max-members=${MATCHMAKING_PARTY_MAX_MEMBERS:6}

# Register the address reachable from the gateway.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.value}
