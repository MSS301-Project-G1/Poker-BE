services:
  api-gateway:
    build:
      context: ..
      args:
        MODULE: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL:-http://discovery-service:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-lb://auth-service}
      GATEWAY_JWK_SET_URI: ${GATEWAY_JWK_SET_URI:-http://auth-service:8090/.well-known/jwks.json}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8090}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-poker}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://localhost:8090}
      GAME_SERVICE_KEY: ${GAME_SERVICE_KEY:-poker_game_dev}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-lb://identity-service}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL:-lb://game-service}
      MATCHMAKING_SERVICE_URL: ${MATCHMAKING_SERVICE_URL:-lb://matchmaking-service}
      SOCIAL_SERVICE_URL: ${SOCIAL_SERVICE_URL:-lb://social-service}
      CHAT_SERVICE_URL: ${CHAT_SERVICE_URL:-lb://chat-service}
      RANKING_SERVICE_URL: ${RANKING_SERVICE_URL:-lb://ranking-service}
      COMPETITION_SERVICE_URL: ${COMPETITION_SERVICE_URL:-lb://competition-service}
      SHOP_SERVICE_URL: ${SHOP_SERVICE_URL:-lb://shop-service}
      WALLET_SERVICE_URL: ${WALLET_SERVICE_URL:-lb://wallet-service}
      SOCIAL_WS_URL: ws://social-service:8084
      CHAT_WS_URL: ws://chat-service:8085
      SOCIAL_GATEWAY_KEY: ${SOCIAL_GATEWAY_KEY:-}
      CHAT_GATEWAY_KEY: ${CHAT_GATEWAY_KEY:-}
    depends_on:
      - auth-service
      - discovery-service
