spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          discovery:
            locator:
              enabled: false
  config:
    import:
    - classpath:services/auth-service.yml
    - classpath:services/identity-service.yml
    - classpath:services/game-service.yml
    - classpath:services/matchmaking-service.yml
    - classpath:services/social-service.yml
    - classpath:services/chat-service.yml
    - classpath:services/ranking-service.yml
    - classpath:services/competition-service.yml
    - classpath:services/shop-service.yml
    - classpath:services/wallet-service.yml
server:
  port: ${SERVER_PORT:8080}
gateway:
  jwt:
    jwk-set-uri: ${GATEWAY_JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:http://localhost:8090}
    audience: ${JWT_AUDIENCE:poker}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:8090}
  game-service-key: ${GAME_SERVICE_KEY:}
  social-gateway-key: ${SOCIAL_GATEWAY_KEY:}
  chat-gateway-key: ${CHAT_GATEWAY_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${random.value}
