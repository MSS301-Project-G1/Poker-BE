spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/auth/**,/api/profiles/**,/api/checkin/**,/api/reports/**,/api/admin/users/**,/api/admin/reports/**
            - id: auth-documentation
              uri: ${AUTH_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/.well-known/jwks.json,/swagger-ui.html,/swagger-ui/**,/v3/api-docs,/v3/api-docs/**
                - Method=GET
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
            - id: game-service
              uri: ${GAME_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/game/**,/api/admin/match-settings/**
            - id: matchmaking-service
              uri: ${MATCHMAKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/matchmaking/**,/api/party/**
            - id: social-service
              uri: ${SOCIAL_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/friends/**,/api/blocks/**,/api/notifications/**
            - id: chat-service
              uri: ${CHAT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/chat/**
            - id: social-websocket
              uri: ${SOCIAL_WS_URL:ws://localhost:8084}
              predicates:
                - Path=/ws/social
            - id: chat-websocket
              uri: ${CHAT_WS_URL:ws://localhost:8085}
              predicates:
                - Path=/ws/chat
            - id: ranking-service
              uri: ${RANKING_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/ranking/**
              filters:
                - StripPrefix=2
            - id: competition-service
              uri: ${COMPETITION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/competition/**
              filters:
                - StripPrefix=2
            - id: shop-service
              uri: ${SHOP_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/shop/**
              filters:
                - StripPrefix=2
            - id: wallet-service
              uri: ${WALLET_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/wallet/**
              filters:
                - StripPrefix=2
server:
  port: ${SERVER_PORT:8080}
gateway:
  jwt:
    jwk-set-uri: ${GATEWAY_JWK_SET_URI:${AUTH_SERVICE_URL:http://localhost:8090}/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:http://localhost:8090}
    audience: ${JWT_AUDIENCE:poker}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:8090}
  game-service-key: ${GAME_SERVICE_KEY:}
  social-gateway-key: ${SOCIAL_GATEWAY_KEY:}
  chat-gateway-key: ${CHAT_GATEWAY_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
