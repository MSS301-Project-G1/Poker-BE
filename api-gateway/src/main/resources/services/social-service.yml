gateway:
  catalog:
    services:
      social-service:
        uri: ${SOCIAL_SERVICE_URL:lb://social-service}
        routes:
        - id: social-service
          paths:
          - /api/friends/**
          - /api/blocks/**
        # STOMP over WebSocket: social-service authenticates the ws-token sent in the CONNECT frame.
        - id: social-service-websocket
          paths:
          - /ws/social
          methods:
          - GET
          preserve-host: true
        public-endpoints:
        - method: GET
          paths:
          - /ws/social
