services:
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      GAME_SERVICE_URL: http://game-service:8082
      MATCHMAKING_SERVICE_URL: http://matchmaking-service:8083
      SOCIAL_SERVICE_URL: http://social-service:8084
      CHAT_SERVICE_URL: http://chat-service:8085
      RANKING_SERVICE_URL: http://ranking-service:8086
      COMPETITION_SERVICE_URL: http://competition-service:8087
      SHOP_SERVICE_URL: http://shop-service:8088
      WALLET_SERVICE_URL: http://wallet-service:8089
    depends_on:
      - identity-service
      - game-service
      - matchmaking-service
      - social-service
      - chat-service
      - ranking-service
      - competition-service

  identity-service:
    build:
      context: .
      args:
        MODULE: identity-service
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"

  game-service:
    build:
      context: .
      args:
        MODULE: game-service
    ports:
      - "${GAME_SERVICE_PORT:-8082}:8082"

  matchmaking-service:
    build:
      context: .
      args:
        MODULE: matchmaking-service
    ports:
      - "${MATCHMAKING_SERVICE_PORT:-8083}:8083"

  social-service:
    build:
      context: .
      args:
        MODULE: social-service
    ports:
      - "${SOCIAL_SERVICE_PORT:-8084}:8084"

  chat-service:
    build:
      context: .
      args:
        MODULE: chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-8085}:8085"

  ranking-service:
    build:
      context: .
      args:
        MODULE: ranking-service
    ports:
      - "${RANKING_SERVICE_PORT:-8086}:8086"

  competition-service:
    build:
      context: .
      args:
        MODULE: competition-service
    ports:
      - "${COMPETITION_SERVICE_PORT:-8087}:8087"

  shop-service:
    build:
      context: .
      args:
        MODULE: shop-service
    ports:
      - "${SHOP_SERVICE_PORT:-8088}:8088"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=poker123456
      - S3_BUCKET=poker-assets
      - S3_PUBLIC_URL=http://localhost:9000/poker-assets
    depends_on:
      - redis
      - minio

  wallet-service:
    build:
      context: .
      args:
        MODULE: wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8089}:8089"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: poker-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: poker-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: poker123456
    volumes:
      - minio-data:/data
    user: "0:0"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq-data:
  redis-data:
  minio-data:

networks:
  default:
    name: poker-network
