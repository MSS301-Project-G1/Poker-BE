services:
  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8090
      IDENTITY_SERVICE_URL: http://identity-service:8081
      GAME_SERVICE_URL: http://game-service:8082
      MATCHMAKING_SERVICE_URL: http://matchmaking-service:8083
      SOCIAL_SERVICE_URL: http://social-service:8084
      CHAT_SERVICE_URL: http://chat-service:8085
      RANKING_SERVICE_URL: http://ranking-service:8086
      COMPETITION_SERVICE_URL: http://competition-service:8087
      SHOP_SERVICE_URL: http://shop-service:8088
      WALLET_SERVICE_URL: http://wallet-service:8089
    depends_on:
      - auth-service
      - identity-service
      - game-service
      - matchmaking-service
      - social-service
      - chat-service
      - ranking-service
      - competition-service
      - shop-service
      - wallet-service
  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8090}:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USERNAME:-poker}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-poker_dev}
      AUTH_MAIL_HOST: auth-mailpit
      AUTH_MAIL_PORT: 1025
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-no-reply@poker.local}
      AUTH_OTP_TTL: ${AUTH_OTP_TTL:-5m}
      AUTH_OTP_MAX_ATTEMPTS: ${AUTH_OTP_MAX_ATTEMPTS:-5}
      AUTH_OTP_RESEND_COOLDOWN: ${AUTH_OTP_RESEND_COOLDOWN:-60s}
      AUTH_RABBIT_HOST: rabbitmq
      AUTH_RABBIT_PORT: 5672
      AUTH_RABBIT_USERNAME: ${AUTH_RABBIT_USERNAME:-poker}
      AUTH_RABBIT_PASSWORD: ${AUTH_RABBIT_PASSWORD:-poker_dev}
      AUTH_EVENTS_DISPATCH_ENABLED: ${AUTH_EVENTS_DISPATCH_ENABLED:-true}
      AUTH_EVENTS_DISPATCH_DELAY: ${AUTH_EVENTS_DISPATCH_DELAY:-5000}
      AUTH_SWAGGER_ENABLED: ${AUTH_SWAGGER_ENABLED:-true}
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-mailpit:
        condition: service_started
      rabbitmq:
        condition: service_healthy
  auth-mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:8026:8025"
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${AUTH_RABBIT_USERNAME:-poker}
      RABBITMQ_DEFAULT_PASS: ${AUTH_RABBIT_PASSWORD:-poker_dev}
    ports:
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  auth-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USERNAME:-poker}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-poker_dev}
    volumes:
      - auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  identity-service:
    build:
      context: .
      args:
        MODULE: identity-service
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
  game-service:
    build:
      context: .
      args:
        MODULE: game-service
    ports:
      - "${GAME_SERVICE_PORT:-8082}:8082"
  matchmaking-service:
    build:
      context: .
      args:
        MODULE: matchmaking-service
    ports:
      - "${MATCHMAKING_SERVICE_PORT:-8083}:8083"
  social-service:
    build:
      context: .
      args:
        MODULE: social-service
    ports:
      - "${SOCIAL_SERVICE_PORT:-8084}:8084"
  chat-service:
    build:
      context: .
      args:
        MODULE: chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-8085}:8085"
  ranking-service:
    build:
      context: .
      args:
        MODULE: ranking-service
    ports:
      - "${RANKING_SERVICE_PORT:-8086}:8086"
  competition-service:
    build:
      context: .
      args:
        MODULE: competition-service
    ports:
      - "${COMPETITION_SERVICE_PORT:-8087}:8087"
  shop-service:
    build:
      context: .
      args:
        MODULE: shop-service
    ports:
      - "${SHOP_SERVICE_PORT:-8088}:8088"
  wallet-service:
    build:
      context: .
      args:
        MODULE: wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8089}:8089"
volumes:
  auth-db:
  rabbit-data:
