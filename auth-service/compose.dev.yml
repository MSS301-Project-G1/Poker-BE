name: poker-auth-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USERNAME:-poker}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-poker_dev}
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  mailpit:
    profiles: ["mailpit"]
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${AUTH_RABBIT_USERNAME:-poker}
      RABBITMQ_DEFAULT_PASS: ${AUTH_RABBIT_PASSWORD:-poker_dev}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - auth-rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  auth-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
    ports:
      - "127.0.0.1:${AUTH_SERVICE_PORT:-8090}:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USERNAME:-poker}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-poker_dev}
      AUTH_MAIL_HOST: ${AUTH_MAIL_HOST:-smtp.gmail.com}
      AUTH_MAIL_PORT: ${AUTH_MAIL_PORT:-587}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-no-reply@poker.local}
      AUTH_MAIL_USERNAME: ${AUTH_MAIL_USERNAME:-}
      AUTH_MAIL_PASSWORD: ${AUTH_MAIL_PASSWORD:-}
      AUTH_MAIL_SMTP_AUTH: ${AUTH_MAIL_SMTP_AUTH:-true}
      AUTH_MAIL_STARTTLS: ${AUTH_MAIL_STARTTLS:-true}
      AUTH_OTP_TTL: ${AUTH_OTP_TTL:-5m}
      AUTH_OTP_MAX_ATTEMPTS: ${AUTH_OTP_MAX_ATTEMPTS:-5}
      AUTH_OTP_RESEND_COOLDOWN: ${AUTH_OTP_RESEND_COOLDOWN:-60s}
      AUTH_RABBIT_HOST: rabbitmq
      AUTH_RABBIT_PORT: 5672
      AUTH_RABBIT_USERNAME: ${AUTH_RABBIT_USERNAME:-poker}
      AUTH_RABBIT_PASSWORD: ${AUTH_RABBIT_PASSWORD:-poker_dev}
      AUTH_EVENTS_DISPATCH_ENABLED: ${AUTH_EVENTS_DISPATCH_ENABLED:-true}
      AUTH_EVENTS_DISPATCH_DELAY: ${AUTH_EVENTS_DISPATCH_DELAY:-5000}
      AUTH_SWAGGER_ENABLED: ${AUTH_SWAGGER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  auth-db:
  auth-rabbit:
