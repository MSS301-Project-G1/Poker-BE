spring.application.name=auth-service
server.port=${SERVER_PORT:8090}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:54330/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:poker}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.mail.host=${AUTH_MAIL_HOST:localhost}
spring.mail.port=${AUTH_MAIL_PORT:1026}
spring.mail.username=${AUTH_MAIL_USERNAME:}
spring.mail.password=${AUTH_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${AUTH_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${AUTH_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.mail.from=${AUTH_MAIL_FROM:no-reply@poker.local}
auth.otp.ttl=${AUTH_OTP_TTL:5m}
auth.otp.max-attempts=${AUTH_OTP_MAX_ATTEMPTS:5}
auth.otp.resend-cooldown=${AUTH_OTP_RESEND_COOLDOWN:60s}
spring.rabbitmq.host=${AUTH_RABBIT_HOST:localhost}
spring.rabbitmq.port=${AUTH_RABBIT_PORT:5673}
spring.rabbitmq.username=${AUTH_RABBIT_USERNAME:poker}
spring.rabbitmq.password=${AUTH_RABBIT_PASSWORD}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
auth.events.dispatch-enabled=${AUTH_EVENTS_DISPATCH_ENABLED:true}
auth.events.dispatch-delay=${AUTH_EVENTS_DISPATCH_DELAY:5000}
