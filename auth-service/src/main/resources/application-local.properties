# Profile "local": run from the IDE while the infra runs in Docker (root docker-compose.yml).
# DB, RabbitMQ and mail are literal on purpose so AUTH_DB_URL / AUTH_RABBIT_* / AUTH_MAIL_* in .env
# (often container addresses such as auth-mailpit:1025) cannot point this profile at another stack.
# Override with SPRING_DATASOURCE_* / SPRING_RABBITMQ_* / SPRING_MAIL_*.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:54330/auth_db
spring.datasource.password=${AUTH_DB_PASSWORD:poker_dev}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5679
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Mailpit (compose profile "mailpit") publishes SMTP on localhost:1026 and takes no credentials.
spring.mail.host=localhost
spring.mail.port=1026
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
auth.jwt.generate-key=${AUTH_JWT_GENERATE_KEY:true}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
