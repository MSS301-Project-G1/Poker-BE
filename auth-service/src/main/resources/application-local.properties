# Profile "local": run from the IDE while the infra runs in Docker (root docker-compose.yml).
# DB and RabbitMQ are literal on purpose so AUTH_DB_URL / AUTH_RABBIT_* left in an old .env
# cannot point this profile at another stack. Override with SPRING_DATASOURCE_* / SPRING_RABBITMQ_*.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:54330/auth_db
spring.datasource.password=${AUTH_DB_PASSWORD:poker_dev}
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5679
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
auth.jwt.generate-key=${AUTH_JWT_GENERATE_KEY:true}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
