# ServiceConnection supplies credentials for a disposable PostgreSQL container.
# No fallback to a developer's PostgreSQL connection or Flyway history.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/auth_test_not_configured
spring.datasource.username=auth_test
spring.datasource.password=auth_test_only
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.root=WARN
spring.rabbitmq.password=auth_test_only
auth.events.dispatch-enabled=false
auth.jwt.generate-key=true
auth.jwt.private-key-path=${java.io.tmpdir}/poker-auth-tests-${random.uuid}.pem
auth.cookie.secure=false

auth.checkin.retry-enabled=false
