name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: poker-be-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/mss301-project-g1/poker

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # --fail-at-end: report every module's test failures in one run.
      - run: ./mvnw -B -ntp --fail-at-end verify

  deploy:
    name: Build images & deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # The VPS is ARM (Oracle Ampere); building on an ARM runner avoids emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_DIR: poker/be
      TAG: ${{ github.sha }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Missing repository secrets VPS_HOST / VPS_USER / VPS_SSH_KEY"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package jars
        run: ./mvnw -B -ntp -DskipTests package

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images
        run: |
          # Every directory with its own compose.yml is a deployable service (common has none).
          for compose in */compose.yml; do
            module="${compose%/compose.yml}"
            image="$IMAGE_PREFIX-$module:$TAG"
            echo "::group::$module"
            docker build -f deploy/Dockerfile --build-arg MODULE="$module" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              -t "$image" "$module/target"
            docker push --quiet "$image"
            echo "::endgroup::"
          done

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -o ConnectTimeout=20 -o ServerAliveInterval=15" >> "$GITHUB_ENV"

      - name: Sync compose files
        run: |
          $SSH_CMD "$VPS_USER@$VPS_HOST" "mkdir -p $APP_DIR"
          rsync -az --delete \
            --exclude '.git/' --exclude 'target/' --exclude '.idea/' --exclude '.env' --exclude '.local/' \
            -e "$SSH_CMD" ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | $SSH_CMD "$VPS_USER@$VPS_HOST" \
            "GHCR_USER=${{ github.actor }} bash $APP_DIR/deploy/remote-deploy.sh $TAG"
