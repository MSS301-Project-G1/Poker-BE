name: wallet-service

services:
  wallet-service:
    build:
      context: ..
      dockerfile: wallet-service/Dockerfile
    container_name: wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8089}:8089"
    environment:
      - DB_HOST=wallet-postgres
      - DB_PORT=5432
      - DB_NAME=wallet_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    depends_on:
      wallet-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wallet-postgres:
    image: postgres:16
    container_name: wallet-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - wallet-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wallet-postgres-data:
  rabbitmq-data:

networks:
  default:
    name: poker-network
