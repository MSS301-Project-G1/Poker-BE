services:
  wallet-service:
    build:
      context: ..
      args:
        MODULE: wallet-service
    ports:
      - "${WALLET_SERVICE_PORT:-8089}:8089"
    environment:
      WALLET_DB_URL: jdbc:postgresql://wallet-postgres:5432/wallet_db
      WALLET_DB_USER: ${WALLET_DB_USER:-postgres}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-123456}
      DB_HOST: wallet-postgres
      DB_PORT: 5432
      DB_NAME: wallet_db
      DB_USERNAME: ${WALLET_DB_USER:-postgres}
      DB_PASSWORD: ${WALLET_DB_PASSWORD:-123456}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-true}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL:-http://discovery-service:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: wallet-service
    networks:
      - default
      - wallet-net
    depends_on:
      wallet-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  wallet-postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: ${WALLET_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${WALLET_DB_PASSWORD:-123456}
    ports:
      - "127.0.0.1:${WALLET_DB_PORT:-54335}:5432"
    volumes:
      - wallet-postgres-data:/var/lib/postgresql/data
    networks:
      - wallet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

networks:
  wallet-net:
volumes:
  wallet-postgres-data:
