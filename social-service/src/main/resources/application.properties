spring.application.name=social-service
server.port=${SERVER_PORT:8084}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${SOCIAL_DB_URL:jdbc:postgresql://localhost:15436/social_db}
spring.datasource.username=${SOCIAL_DB_USER:poker}
spring.datasource.password=${SOCIAL_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USER:poker}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
social.gateway-key=${SOCIAL_GATEWAY_KEY:}
social.internal-key=${SOCIAL_INTERNAL_KEY:}
social.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}
social.jwt.issuer=${JWT_ISSUER:http://localhost:8090}
social.jwt.audience=${JWT_AUDIENCE:poker}
social.ws.allowed-origins=${SOCIAL_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:18080,http://localhost:8080}
social.ws.message-size=${SOCIAL_WS_MESSAGE_SIZE:8192}
social.ws.messages-per-second=${SOCIAL_WS_RATE:10}
springdoc.paths-to-match=/api/**

eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${random.value}
